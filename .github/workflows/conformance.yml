name: Conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/conformance.yml"
      - "dune-project"
      - "idna.opam"
      - "lib/**"
      - "test/**"
      - "tools/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/conformance.yml"
      - "dune-project"
      - "idna.opam"
      - "lib/**"
      - "test/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  conformance:
    name: UTS #46 conformance gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.1"

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test -y

      - name: Download Unicode data
        run: ./tools/download_ucd.sh 16.0.0

      - name: Run conformance gate
        run: opam exec -- dune build @test/conformance --force
